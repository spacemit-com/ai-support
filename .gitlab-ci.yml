# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:             # List of stages for jobs, and their order of execution
  - build
  - test
  - package
  - deploy

image: harbor.bianbu.xyz/bianbu-ai/bianbu-ai-support@sha256:608c5d8659711ca381a840438b623d58fbce3f583f3bad54d10afd0b061a8f17

variables:
  SDK: "/opt/spacemit-ai-sdk.v0.5.1.x"
  DATA: "$SDK/bianbu-ai-support/data"
  CROSS_TOOL: "$SDK/spacemit-gcc/bin/riscv64-unknown-linux-gnu-"
  SYSROOT: "$SDK/spacemit-gcc/sysroot"
  QEMU_CMD: "$SDK/qemu/bin/qemu-riscv64 -L $SYSROOT"

build-job-x86_64:   # This job runs in the build stage, which runs first.
  stage: build
  variables:
    BUILD_DIR: "build.x86_64"
    ORT_HOME: "/home/workspace/onnxruntime-linux-x64-1.15.1"
    OPENCV_LIB: "/usr/lib/x86_64-linux-gnu"
    INSTALL_PREFIX: "bianbu-ai-support.x86_64"
  before_script:
    - echo "Before scripts ..."
  script:
    - echo "Compiling the code ..."
    - mkdir ${BUILD_DIR} && pushd ${BUILD_DIR} && cmake .. -DORT_HOME=${ORT_HOME} -DOPENCV_LIB=${OPENCV_LIB} -DCMAKE_INSTALL_PREFIX=${INSTALL_PREFIX} && make install -j`nproc` && popd
  #  - echo "Compile complete."
  artifacts:
    paths:
      - ${BUILD_DIR}

build-job-riscv64:  # This job runs in the build stage, which runs second.
  stage: build
  variables:
    BUILD_DIR: "build.riscv64"
    ORT_HOME: "$SDK/spacemit-ort"
    OpenCV_DIR: "$SDK/bianbu-ai-support/3rdparty/opencv4/lib/cmake/opencv4/"
    INSTALL_PREFIX: "bianbu-ai-support.riscv64"
  before_script:
    - echo "Before scripts ..."
  script:
    - echo "Compiling the code ..."
    - mkdir ${BUILD_DIR} && pushd ${BUILD_DIR} && cmake .. -DORT_HOME=${ORT_HOME} -DDOpenCV_DIR=${DOpenCV_DIR} -DCMAKE_C_COMPILER=${CROSS_TOOL}gcc -DCMAKE_CXX_COMPILER=${CROSS_TOOL}g++ -DCMAKE_SYSROOT=${SYSROOT} -DCMAKE_INSTALL_PREFIX=${INSTALL_PREFIX} && make install -j`nproc` && popd
  #  - echo "Compile complete."
  artifacts:
    paths:
      - ${BUILD_DIR}

x86_64-test-job:    # This job runs in the test stage.
  stage: test       # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests ... (This will take several seconds.)"
    - build.x86_64/demo/classification_demo $DATA/models/squeezenet1.1-7.onnx $DATA/labels/synset.txt $DATA/imgs/dog.jpg
    - build.x86_64/demo/detection_demo $DATA/models/nanodet-plus-m_320.onnx $DATA/imgs/person0.jpg result0.jpg $DATA/labels/coco.txt
    - echo "detection_demo result md5sum:" $(md5sum result0.jpg) 
    - echo "Running x86_64 tests done!"

riscv64-test-job:   # This job runs in the test stage.
  stage: test       # It only starts when the job in the build stage completes successfully.
  script:
    - echo "Running unit tests ... (This will take several seconds.)"
    - export LD_LIBRARY_PATH=${ORT_HOME}/lib:$LD_LIBRARY_PATH
    - ${QEMU_CMD} build.riscv64/demo/classification_demo $DATA/models/squeezenet1.1-7.onnx $DATA/labels/synset.txt $DATA/imgs/dog.jpg
    - ${QEMU_CMD} build.riscv64/demo/detection_demo $DATA/models/nanodet-plus-m_320.onnx $DATA/imgs/person0.jpg result0.jpg $DATA/labels/coco.txt
    - echo "detection_demo result md5sum:" $(md5sum result0.jpg) 
    - echo "Running riscv64 tests done!"

package:
  stage: package
  variables:
    timestamp: ""
  script:
    - timestamp=$(date +"%Y%m%d_%H%M%S")
    - mkdir output
    - pushd build.x86_64 && tar czf ../output/bianbu-ai-support.x86_64.$(date +"%Y%m%d_%H%M%S").tar.gz bianbu-ai-support.x86_64 && popd
    - pushd build.riscv64 && tar czf ../output/bianbu-ai-support.riscv64.$(date +"%Y%m%d_%H%M%S").tar.gz bianbu-ai-support.riscv64 && popd
    - rm -rf build.x86_64 build.riscv64
  artifacts:
    paths:
      - output

lint-test-job:   # This job also runs in the test stage.
  stage: test    # It can run at the same time as unit-test-job (in parallel).
  script:
    - echo "Linting code... This will take about 2 seconds."
    - sleep 2
    - echo "No lint issues found."

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  environment: production
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."


# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence

sast:
  stage: test

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml